<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67 Airlines</title>
<style>
        body {
            background-image: url("{{ url_for('static', filename='logo.jpeg') }}");
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            height: 100vh;                   
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(255, 255, 255);                    
            }
        .header-text {
            text-align: center;
            text-shadow: 3px 3px 6px rgb(18, 1, 1);
            margin-bottom: 20px;
        }

        .header-text h1, .header-text p {
            -webkit-text-stroke: 1px rgb(251, 246, 246); 
        }
        .search-box {
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 750px;
            border: 2px solid #000000;
        }
        .trip-type {
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            align-items: end;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-buscar {
            padding: 11px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-buscar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Bienvenido a 67 Airlines!</h1> 
        <p>La mejor aerolinea para viajar</p>
    </div>

    <div class="search-box">
        <form action="/vuelos" method="GET">
            <!-- Selección de tipo de vuelo -->
            <div class="trip-type">
                <label>
                    <input type="radio" name="tipo_vuelo" value="redondo" checked onclick="toggleRegreso(true)"> Redondo
                </label>
                <label>
                    <input type="radio" name="tipo_vuelo" value="sencillo" onclick="toggleRegreso(false)"> Sencillo
                </label>
            </div>

            <!-- Campos del buscador -->
            <div class="form-grid">
                <div class="input-group">
                    <label for="origen">Origen</label>
                    <select id="origen" name="origen" required>
                        <option value="" disabled selected>Selecciona origen</option>
                        <option value="Tijuana">Tijuana (TIJ)</option>
                        <option value="Ciudad de Mexico">Ciudad de Mexico (MEX)</option>
                        <option value="Guadalajara">Guadalajara (GDL)</option>
                        <option value="Monterrey">Monterrey (MTY)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="destino">Destino</label>
                    <select id="destino" name="destino" required>
                        <option value="" disabled selected>Selecciona destino</option>
                        <option value="Tijuana">Tijuana (TIJ)</option>
                        <option value="Ciudad de Mexico">Ciudad de Mexico (MEX)</option>
                        <option value="Guadalajara">Guadalajara (GDL)</option>
                        <option value="Monterrey">Monterrey (MTY)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="fecha_ida">Fecha de ida</label>
                    <input type="date" id="fecha_ida" name="fecha_ida" required>
                </div>

                <div class="input-group" id="grupo_regreso">
                    <label for="fecha_regreso">Fecha de regreso</label>
                    <input type="date" id="fecha_regreso" name="fecha_regreso" required>
                </div>

                <div class="input-group">
                    <label for="pasajeros">Pasajeros</label>
                    <input type="number" id="pasajeros" name="pasajeros" min="1" max="10" value="1" required>
                </div>

                <div class="input-group">
                    <button type="submit" class="btn-buscar">Buscar Vuelos</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        function toggleRegreso(esRedondo) {
            const inputRegreso = document.getElementById('fecha_regreso');
            const grupoRegreso = document.getElementById('grupo_regreso');
            if (esRedondo) {
                inputRegreso.disabled = false;
                inputRegreso.required = true;
                grupoRegreso.style.opacity = '1';
            } else {
                inputRegreso.disabled = true;
                inputRegreso.required = false;
                inputRegreso.value = '';
                grupoRegreso.style.opacity = '0.4';
            }
        }
    </script>

</body>
</html>
